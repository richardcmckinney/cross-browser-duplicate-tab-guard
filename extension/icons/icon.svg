<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="backTabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Back tab (secondary browser) -->
  <rect x="36" y="28" width="60" height="46" rx="9" fill="url(#backTabGrad)" stroke="#a5b4fc" stroke-width="2" stroke-opacity="0.9" />
  <line x1="45" y1="40" x2="87" y2="40" stroke="#c7d2fe" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round" />
  
  <!-- Front tab (active browser) -->
  <rect x="24" y="46" width="62" height="48" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <line x1="33" y1="58" x2="77" y2="58" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8" stroke-linecap="round" />
  
  <!-- Guard Badge -->
  <circle cx="92" cy="92" r="22" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
  <path d="M82 92 L88 98 L103 84" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
