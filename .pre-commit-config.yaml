# Secret check before every commit.
#
# Install once per clone:
#   pip install pre-commit
#   pre-commit install
#
# The hook runs gitleaks against the staged changes with the repository's
# .gitleaks.toml. The same gitleaks version and configuration run in CI
# (.github/workflows/secret-scan.yml), so a clone without the hook is still
# checked before merge.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
