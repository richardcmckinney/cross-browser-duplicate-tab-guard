name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: self-test and Chrome Web Store package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Embedded self-test (coordinator, native messaging, store build)
        run: python3 cross_browser_duplicate_tab_guard.py self-test
      - name: JavaScript syntax of the unpacked extension
        run: for file in extension/*.js; do node --check "$file"; done
      - name: Build the Chrome Web Store package
        run: python3 scripts/package_extension.py --output-dir dist
      - name: Check the package is reproducible and free of computer-specific text
        run: |
          set -euo pipefail
          first="$(sha256sum dist/*-webstore.zip | cut -d' ' -f1)"
          python3 scripts/package_extension.py --output-dir dist-again > /dev/null
          second="$(sha256sum dist-again/*-webstore.zip | cut -d' ' -f1)"
          test "$first" = "$second"
          mkdir unpacked
          cd unpacked
          unzip -q ../dist/*-webstore.zip
          if grep -rlE '__WS_PORT__|ws://|127\.0\.0\.1|localhost|/Users/|/home/' .; then
            echo "computer-specific text found in the package" >&2
            exit 1
          fi
          python3 -c 'import json; m = json.load(open("manifest.json")); assert "key" not in m and len(m["description"]) <= 132 and m["manifest_version"] == 3, m'
          for file in *.js; do node --check "$file"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-web-store-package
          path: dist/
          if-no-files-found: error
          retention-days: 30
